<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="description" content="一个搜索框，并发搜遍所有追剧站点，结果汇总到一处。" />
  <title>追剧聚合 · 一个搜索框搜遍所有站</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="追剧聚合" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">追</div>
      <div>
        <h1>追剧聚合</h1>
        <p id="brand-sub">正在加载资源库…</p>
      </div>
    </div>
    <nav class="tabs" aria-label="页面导航">
      <button class="tab active" type="button" data-view="search">聚合搜索</button>
      <button class="tab" type="button" data-view="nav">站点导航</button>
      <button class="tab" type="button" data-view="mine">我的</button>
    </nav>
  </header>

  <main>
    <section id="view-search" class="view active">
      <form id="search-form" class="searchbar" autocomplete="off">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="q" name="q" type="search" placeholder="输入剧名，例如：今天是太阳雨 / 漫长的季节 / 庆余年" spellcheck="false" />
        <button type="submit" id="go">搜全网</button>
      </form>

      <div class="chips" id="chips">
        <button class="chip active" type="button" data-cat="">全部可搜索站点</button>
        <button class="chip" type="button" data-cat="online_video">在线影视</button>
        <button class="chip" type="button" data-cat="cloud_search">网盘搜索</button>
        <button class="chip" type="button" data-cat="magnet_search">磁力 BT</button>
        <button class="chip" type="button" data-cat="subtitles">字幕</button>
      </div>

      <div id="statusline" class="statusline hidden"></div>
      <div id="results" class="results"></div>
      <div id="empty" class="empty">
        <div class="empty-ico">🍿</div>
        <p>输入片名，一次并发搜索 <strong id="site-count">–</strong> 个站点</p>
        <p class="muted">结果来自各站点自己的搜索结果页，点击即在浏览器打开</p>
      </div>
    </section>

    <section id="view-nav" class="view">
      <div class="chips" id="nav-chips"></div>
      <div id="nav-grid" class="nav-grid"></div>
    </section>

    <section id="view-mine" class="view">
      <div class="panel">
        <div class="panel-head">
          <h2>关键词对比</h2>
          <span class="muted">同时搜多个片名，看哪个关键词在哪几个站有货</span>
        </div>
        <div class="cmp-input">
          <input id="cmp-q" placeholder="多个片名用逗号分隔，例如：庆余年, 繁花, 漫长的季节" />
          <button id="cmp-go" type="button">开始对比</button>
        </div>
        <div id="cmp-out"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>搜索历史</h2>
          <button class="link-btn" id="history-clear" type="button">清空</button>
        </div>
        <div id="history-list" class="pill-list"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>收藏站点</h2>
          <span class="muted">在“站点导航”里点星标收藏</span>
        </div>
        <div id="fav-list" class="nav-grid"></div>
      </div>
    </section>
  </main>

  <footer>
    <span>本工具仅聚合同一网络中的公开链接，不托管、不转存任何内容。请遵守所在地法律法规，支持正版。</span>
    <span id="meta" class="muted"></span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
